name: validate

on:
  push:
  pull_request:

jobs:
  repository:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate manifest and sanitization
        shell: pwsh
        run: |
          Get-Content .codex-plugin/plugin.json -Raw | ConvertFrom-Json | Out-Null
          ./scripts/check-sanitization.ps1
      - name: Smoke-test project bootstrap
        shell: pwsh
        run: |
          $target = Join-Path $env:RUNNER_TEMP 'workflow-demo'
          ./scripts/init-project.ps1 -ProjectRoot $target -ProjectName 'Workflow Demo' -Engine Godot
          $required = @(
            'AGENTS.md',
            'docs/WORKFLOW.md',
            'docs/project_profile.yaml',
            'docs/active_scope.yaml',
            'PM/feature_progress.xlsx'
          )
          foreach ($relative in $required) {
            if (-not (Test-Path (Join-Path $target $relative))) { throw "Missing $relative" }
          }
